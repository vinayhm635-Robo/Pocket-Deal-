<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Pocket Deal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo"><span>PD</span> Pocket Deal</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="bulk.html">Bulk Deals</a>
        <a href="cart.html">Cart (<span id="cartCount">0</span>)</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="page-header">
    <h1>Shop Products</h1>
    <p>Find your product and negotiate your best deal.</p>
</section>

<section class="shop-section">

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            oninput="displayProducts()"
        >
    </div>

    <div class="category-row">
        <button onclick="filterCategory('All')">All</button>
        <button onclick="filterCategory('Laptop')">💻 Laptops</button>
        <button onclick="filterCategory('Mobile')">📱 Mobiles</button>
        <button onclick="filterCategory('Headphones')">🎧 Headphones</button>
        <button onclick="filterCategory('Shoes')">👟 Shoes</button>
    </div>

    <div id="productList" class="product-grid"></div>

</section>

<script src="script.js"></script>
</body>
</html>
