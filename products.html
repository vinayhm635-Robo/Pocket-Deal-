<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Pocket Deal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <span>PD</span> Pocket Deal
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="bulk.html">Bulk Deals</a>
        <a href="cart.html">🛒 Cart <b id="cartCount">0</b></a>
        <a href="login.html">Login</a>
    </nav>

</header>

<main class="section">

    <div class="shop-top">

        <div>
            <h1>Explore Products</h1>
            <p>Find products at great prices.</p>
        </div>

        <input
            type="search"
            id="searchInput"
            placeholder="🔎 Search products..."
            oninput="displayProducts()"
        >

    </div>

    <div class="filters">

        <button onclick="filterCategory('All')">All</button>
        <button onclick="filterCategory('Laptop')">💻 Laptop</button>
        <button onclick="filterCategory('Mobile')">📱 Mobile</button>
        <button onclick="filterCategory('Headphones')">🎧 Headphones</button>
        <button onclick="filterCategory('Shoes')">👟 Shoes</button>

    </div>

    <div id="productList" class="product-grid"></div>

</main>

<footer>
    <h2>PD | Pocket Deal</h2>
    <p>Shop smarter. Save better.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
