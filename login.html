<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pocket Deal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo"><span>PD</span> Pocket Deal</a>
</header>

<section class="auth-page">

    <form class="auth-card" onsubmit="loginUser(event)">

        <div class="logo-large">PD</div>

        <h1>Welcome Back</h1>
        <p>Login to Pocket Deal</p>

        <input
            id="loginEmail"
            type="email"
            placeholder="Email"
            required
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
            required
        >

        <button class="btn-primary full">
            Login
        </button>

        <div class="divider">OR</div>

        <button
            type="button"
            class="google-btn"
            onclick="googleLogin()"
        >
            Continue with Google
        </button>

    </form>

</section>

<script src="script.js"></script>
</body>
</html>
