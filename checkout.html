<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Pocket Deal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <span>PD</span> Pocket Deal
    </a>

    <nav>
        <a href="products.html">Shop</a>
        <a href="cart.html">🛒 Cart <b id="cartCount">0</b></a>
    </nav>

</header>

<main class="section">

    <div class="checkout-layout">

        <div class="form-card">

            <h1>Delivery Details</h1>
            <p class="muted">
                Enter your details to continue.
            </p>

            <form onsubmit="goToPayment(event)">

                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Your full name"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="your@email.com"
                    required
                >

                <label>Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="10 digit mobile number"
                    pattern="[0-9]{10}"
                    required
                >

                <label>Address</label>
                <textarea
                    id="address"
                    placeholder="House number, street, area"
                    required
                ></textarea>

                <div class="two-columns">

                    <div>
                        <label>City</label>
                        <input
                            type="text"
                            id="city"
                            placeholder="City"
                            required
                        >
                    </div>

                    <div>
                        <label>PIN Code</label>
                        <input
                            type="text"
                            id="pincode"
                            placeholder="6 digit PIN"
                            pattern="[0-9]{6}"
                            required
                        >
                    </div>

                </div>

                <button class="btn-primary full" type="submit">
                    Continue to Payment
                </button>

            </form>

        </div>

        <aside class="summary-card">

            <h2>Your Order</h2>

            <div id="checkoutItems"></div>

            <hr>

            <div class="summary-total">
                <span>Total</span>
                <strong id="checkoutTotal">₹0</strong>
            </div>

        </aside>

    </div>

</main>

<footer>
    <h2>PD | Pocket Deal</h2>
    <p>Shop smarter. Save better.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
