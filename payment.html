<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Pocket Deal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo"><span>PD</span> Pocket Deal</a>
</header>

<section class="section payment-page">

    <div class="payment-card">

        <h1>Complete Payment</h1>

        <p>Total Amount</p>
        <div id="paymentTotal" class="payment-total">₹0</div>

        <h3>Select Payment Method</h3>

        <label class="payment-option">
            <input type="radio" name="payment" value="UPI" checked>
            📱 UPI
        </label>

        <label class="payment-option">
            <input type="radio" name="payment" value="Card">
            💳 Card
        </label>

        <label class="payment-option">
            <input type="radio" name="payment" value="COD">
            📦 Cash on Delivery
        </label>

        <button
            class="btn-primary full"
            onclick="placeOrder()"
        >
            Pay & Place Order
        </button>

        <p class="secure">🔒 Demo secure payment</p>

    </div>

</section>

<script src="script.js"></script>
</body>
</html>
