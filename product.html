<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product - Pocket Deal</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <div class="logo">
        <span>PD</span> Pocket Deal
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>

<main class="product-details">

    <div class="large-product-image">
        💻
    </div>

    <div class="product-info">

        <span class="discount">
            20% OFF
        </span>

        <h1>
            Premium Laptop
        </h1>

        <div class="rating">
            ⭐ 4.6 · 2,348 ratings
        </div>

        <p>
            Powerful laptop designed for students,
            developers, creators and everyday productivity.
        </p>

        <div class="price large-price">
            ₹59,999
        </div>

        <p class="old-price">
            MRP ₹69,999
        </p>

        <div class="deal-box">

            🤖
            <strong>Pocket Deal AI Deal</strong>

            <br>

            We found a competitive deal for you.

        </div>

        <button
            onclick="addToCart('Premium Laptop',59999,'💻')"
            class="primary-btn">

            Add to Cart

        </button>

        <button
            onclick="buyNow()"
            class="secondary-btn">

            Buy Now

        </button>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
