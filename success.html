<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Successful - Pocket Deal</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<main class="success-page">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Order Confirmed!
        </h1>

        <p>
            Thank you for shopping with Pocket Deal.
            Your order has been successfully placed.
        </p>

        <div class="order-number">

            Order ID:

            <strong id="orderId"></strong>

        </div>

        <div class="delivery-box">

            🚚
            <strong>
                Estimated Delivery
            </strong>

            <br>

            3–5 business days

        </div>

        <a
            href="products.html"
            class="primary-btn">

            Continue Shopping

        </a>

        <a
            href="index.html"
            class="back-home">

            Back to Home

        </a>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
