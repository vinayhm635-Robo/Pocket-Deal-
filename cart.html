<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Pocket Deal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <span>PD</span> Pocket Deal
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="bulk.html">Bulk Deals</a>
        <a href="cart.html">🛒 Cart <b id="cartCount">0</b></a>
    </nav>

</header>

<main class="section">

    <div class="section-title">
        <h1>Your Shopping Cart</h1>
        <p>Review your products before checkout.</p>
    </div>

    <div class="cart-layout">

        <div id="cartItems"></div>

        <aside class="summary-card">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="subtotal">₹0</strong>
            </div>

            <div class="summary-row">
                <span>Delivery</span>
                <strong>FREE</strong>
            </div>

            <hr>

            <div class="summary-total">
                <span>Total</span>
                <strong id="cartTotal">₹0</strong>
            </div>

            <a href="checkout.html" class="btn-primary full" onclick="return checkCartBeforeCheckout()">
    Proceed to Checkout
            </a>

            <a href="products.html" class="continue">
                ← Continue Shopping
            </a>

        </aside>

    </div>

</main>

<footer>
    <h2>PD | Pocket Deal</h2>
    <p>Shop smarter. Save better.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
