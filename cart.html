<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Cart - Pocket Deal</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <div class="logo">
        <span>PD</span> Pocket Deal
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html">
            🛒 Cart
            <b id="cartCount">0</b>
        </a>

    </nav>

</header>

<main class="cart-page">

    <div class="page-title">

        <p class="small-title">
            YOUR SHOPPING BAG
        </p>

        <h1>
            Shopping Cart
        </h1>

    </div>

    <div id="cartItems"></div>

    <div class="cart-summary">

        <h2>
            Order Summary
        </h2>

        <div class="summary-row">

            <span>
                Subtotal
            </span>

            <strong id="subtotal">
                ₹0
            </strong>

        </div>

        <div class="summary-row">

            <span>
                Delivery
            </span>

            <strong>
                FREE
            </strong>

        </div>

        <div class="summary-row total">

            <span>
                Total
            </span>

            <strong id="total">
                ₹0
            </strong>

        </div>

        <button
            onclick="goCheckout()"
            class="primary-btn full-btn">

            Proceed to Checkout

        </button>

        <a
            href="products.html"
            class="continue-shopping">

            ← Continue Shopping

        </a>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
